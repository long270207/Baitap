<!DOCTYPE html>

<html>
   
    <head>
        <title>Tieu de...</title>
    </head>
<!-- Cach comment :    ctrl + /      --> 
    <body>

        <h1>Test</h1> <!-- <h1> ...</h1> : the tieu de  -->
        <p>hehe</p> <!--<p>... </p> : The doan van -->  

        <p>Chuc mung <b>Tran Long</b></p>  <!-- <b> .... </b>: giup doan van in dam  -->
        <p>Chuc mung <i>Tran Long</i></p>  <!-- <i> ... </i> : giup doan van in nghieng -->

        <p>H<sub>2</sub>O</p> <!-- <sub> ... </sub> : doan van co chi so ben duoi -->
        <p>a<sup>2</sup></p> <!-- <sup> ... </sup> : doan van co chi so ben tren -->
        
        <p><del>12.000.000.000</del></p> <!-- <del> ... </del> : doan van da bi xoa -->
        
        <!--src = "hinhanh.jpg"
            alt = "abc" nếu link ảnh lỗi thì sẽ hiện phần chữ trong "..."   -->
        <img
        src="https://i0.wp.com/thatnhucuocsong.com.vn/wp-content/uploads/2022/09/Hinh-anh-meo-cute-dang-yeu-qua-doi.jpg?ssl=1" 
        alt="Anh con meo"
        />

        <img
        src=".com.vn/wp-content/uploads/2022/09/Hinh-anh-meo-cute-dang-yeu-qua-doi.jpg?ssl=1" 
        alt="ANH CON MEO"
        />

        <!-- <img src="image.jpg" alt=""/>   :   file ảnh nằm cùng cấp với file index.html -->
        <!-- <img src="tenthumuc/image.jpg" alt=""/> : file ảnh nằm trong 1 folder khác, folder đó nằm cùng một folder với file index-->
        <!-- <img src="../image.jpg" alt=""/> : file ảnh nằm ngoài folder chứa file index.html  -->
        
        <a href = "url" target = "..." >tên link</a>    <!--href = "Dia chi lien ket" 
                                        target = "_self" : mở tài liệu trong tab hiện tại
                                        target = "_blank" : mở tài liệu trong tab mới-->
        
        

    </body>

</html>
