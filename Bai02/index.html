<!DOCTYPE html>

<html>
    
    <head>
        <title>Bai 2</title>
    </head>

    <body>

        <!-- Thẻ video : chèn video-->
        <video width="320" height="240" controls><!-- width : chieu rong      
                                                height: chieu cao  controls: 
                                                thanh dieu khien [tang giam am luong,....] -->
            <source src="linkvideo.mp4" type="video.mp4"> <!-- type : loai video [mp4, ogg, webm] -->
        </video>

        <!-- Thẻ audio : chèn audio-->
        <audio controls>
            <source src="linhaudio.mp3" type="audio/mpeg"> <!-- type : [mp3 la mpeg, ogg, wav, webm]-->
        </audio>

        <!-- Một đoạn CSS để bảng dễ nhìn-->
        <style>
            table, th, td {
                border: 1px solid #ddd;
            }
            th, td {
                padding: 10px;
            }
        </style>

        <!-- Thẻ table : chèn bảng-->
        <table>
            <thead> <!-- Tiêu đề-->
                <tr> <!-- Hàng trong bảng-->
                    <th>Hàng 1 cột 1</th> <!-- In đậm, căn giữa, là tên đầu đề của cột-->
                    <th>Hàng 1 cột 2</th>
                </tr>
            </thead>
            <tbody> <!-- Thân bảng-->
                <tr> <!-- Cách tạo bảng nhanh: tr*x>td*x--> 
                    <td>Hàng 2 cột 1</td> <!--Văn bản bình thường, căn lề trái -->
                    <td>Hàng 2 cột 2</td> <!-- td rowspan = "x" : để ô này chiếm x hàng trong bảng-->
                </tr>
                <tr>
                    <td>Hàng 3 cột 1</td> 
                    <td>Hàng 3 cột 2</td>
                </tr>
            </tbody>
        </table>



    </body>

</html>
